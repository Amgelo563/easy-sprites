name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Don't tag or release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test
        run: ./gradlew check

      - name: Conventional changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: conventionalcommits
          output-file: 'false'
          skip-version-file: true
          skip-commit: true
          skip-tag: ${{ inputs.dry-run }}
          skip-on-empty: true

      - name: Dry run
        if: inputs.dry-run && steps.changelog.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          {
            echo "## dry: would release v$VERSION"
            echo
            echo "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release artifacts
        if: steps.changelog.outputs.skipped != 'true' && !inputs.dry-run
        run: ./gradlew assemble -Pversion=${{ steps.changelog.outputs.version }}

      - name: Create GitHub release
        if: steps.changelog.outputs.skipped != 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --title "$TAG" \
            --notes "$NOTES"
